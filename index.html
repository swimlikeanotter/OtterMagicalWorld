<HEAD>
<meta content="text/html;charset=utf-8" http-equiv="Content-Type">
<meta content="utf-8" http-equiv="encoding">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<TITLE>OtterMagicalWorld - A WebGL Graphics Engine</TITLE>
<STYLE>
H1 { font-family: Impact, Charcoal, sans-serif; font-size: 36pt; color: #FFFFFF;}
H2 { font-family: Impact, Charcoal, sans-serif; font-size: 24pt; color: #FFFFFF;}
H3 { font-family: Impact, Charcoal, sans-serif; font-size: 18pt; color: #FFFFFF;}
TD, A, input[type=text]{ font-family: Impact, Charcoal, sans-serif; font-size: 26pt; color: #FFFFFF; background: transparent; border-style: none}
P { font-family: Impact, Charcoal, sans-serif; font-size: 12pt; color: #FFFFFF; background: transparent; border-style: none}
BODY,HTML {background-color: black; width:100%; height:100%; border: 0px; padding: 0px; margin: 0px; overflow-y: hidden; overflow-x: hidden;}

#glcanvas {
    display: block;
    width: 100%;
    height: 100%;
}

/* Mobile controls: hidden on conventional mouse-and-keyboard screens. */
.touch-stick {
    display: none;
    position: fixed;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    width: clamp(88px, 24vmin, 132px);
    aspect-ratio: 1;
    border: 2px solid rgba(255,255,255,0.60);
    border-radius: 50%;
    background: rgba(0,0,0,0.15);
    box-sizing: border-box;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    z-index: 1001;
}
#touchMove { left: calc(20px + env(safe-area-inset-left, 0px)); }
#touchLook { right: calc(20px + env(safe-area-inset-right, 0px)); }
.touch-knob {
    position: absolute;
    left: 50%; top: 50%;
    width: 36%; height: 36%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: rgba(255,255,255,0.45);
    pointer-events: none;
}
.touch-label {
    position: absolute;
    top: -20px;
    width: 100%;
    text-align: center;
    color: white;
    font: bold 11px system-ui, sans-serif;
    text-shadow: 0 1px 3px #333;
    pointer-events: none;
}
@media (any-pointer: coarse) {
    .touch-stick { display: block; }
    #glcanvas { touch-action: none; }
    #fps { font-size: 16px; }
    #fpsOverlay td { font-size: 16px; }
}
</STYLE>

<script src="javascript/engine.js" type="text/javascript"></script>

<!-- Fragment Shader -->
<script id="shader-fs" type="x-shader/x-fragment">

#ifdef GL_ES
precision mediump float;
#endif

uniform sampler2D uSampler;
uniform float uTerrainPatch;

varying mediump vec2 vTextureCoord;
varying mediump float vLight;
varying mediump float vFogDistance;

void main(void) {

    vec4 colour = texture2D(uSampler, vTextureCoord);

    if (uTerrainPatch > 0.5) {

        float patch = vTextureCoord.x;

        vec3 darkGrass = vec3(0.12, 0.42, 0.12);
        //vec3 goldenGrass = vec3(0.65, 0.65, 0.18);
        vec3 goldenGrass = vec3(0.56, 0.60, 0.16);

        colour.rgb = mix(
            darkGrass,
            goldenGrass,
            smoothstep(0.35, 0.65, patch)
        );
    }

    // Gentle atmospheric distance fog.
    float fog = smoothstep(
        1100.0,
        1750.0,
        vFogDistance
    );

    // Soft blue countryside haze.
    vec3 fogColour = vec3(0.76, 0.87, 0.97);

    // Apply sunlight first, then blend into the haze.
    vec3 litColour = colour.rgb * vLight;

    vec3 finalColour = mix(
        litColour,
        fogColour,
        fog
    );

    gl_FragColor = vec4(finalColour, colour.a);

}


</script>


<!-- Vertex Shader -->
<script id="shader-vs" type="x-shader/x-vertex">

attribute vec3 aVertexPosition;
attribute vec2 aTextureCoord;
attribute vec3 aVertexNormal;

uniform mat4 uMVMatrix;
uniform mat4 uPMatrix;

varying mediump vec2 vTextureCoord;
varying mediump float vLight;
varying mediump float vFogDistance;
uniform vec3 uSunDirection;

void main(void) {

    gl_Position = uPMatrix * uMVMatrix *
                  vec4(aVertexPosition, 1.0);

    vec4 cameraPosition = uMVMatrix * vec4(aVertexPosition, 1.0);
    vFogDistance = length(cameraPosition.xyz);

    vTextureCoord = aTextureCoord;

    // Direction towards our imaginary sun ( fixed sunshine position )
    vec3 sun = normalize(vec3(-0.5, 1.0, 0.7));

    // we move the sunlight with this from the JavaScript
    // vec3 sun = normalize(uSunDirection);

    // How directly does the surface face the sun?
    float brightness = max(
        dot(normalize(aVertexNormal), sun),
        0.0
    );

    // Some ambient light, even on shaded slopes.
    //vLight = 0.35 + 0.65 * brightness;
    vLight = 0.60 + 0.40 * brightness;
}
</script>

</HEAD>

<BODY onLoad="start();">

<canvas id="glcanvas">Your browser doesn't appear to support the HTML5 <code>&lt;canvas&gt;</code> element.</canvas>

<div id="fpsOverlay" style="position: absolute; left: calc(20px + env(safe-area-inset-left, 0px)); top: calc(20px + env(safe-area-inset-top, 0px)); z-index: 1000">
  <table>
  <tr><td>FPS</td><td><input type="text" value="0" id="fps" readonly></input></td></tr>
  </table>
</div>


<div id="touchMove" class="touch-stick" aria-label="Movement joystick">
    <span class="touch-label">MOVE</span>
    <div class="touch-knob"></div>
</div>
<div id="touchLook" class="touch-stick" aria-label="Look joystick">
    <span class="touch-label">LOOK</span>
    <div class="touch-knob"></div>
</div>

</BODY>
